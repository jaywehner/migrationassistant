{% extends "base.html" %}
{% block title %}New Plan - Migration Platform{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card">
            <div class="card-body p-4">
                <h4 class="mb-4"><i class="bi bi-plus-circle me-2"></i>Create Migration Plan</h4>

                {% if errors %}
                <div class="alert alert-danger py-2">
                    {% for error in errors %}
                    <small>{{ error }}</small>{% if not loop.last %}<br>{% endif %}
                    {% endfor %}
                </div>
                {% endif %}

                <form method="post" action="/plans/new">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <div class="mb-3">
                        <label for="name" class="form-label">Plan Name</label>
                        <input type="text" class="form-control" id="name" name="name" required placeholder="e.g., Q1 Cloud Migration" autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">Description <span class="text-muted">(optional)</span></label>
                        <textarea class="form-control" id="description" name="description" rows="3" placeholder="Brief description of this migration plan..."></textarea>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Create Plan</button>
                        <a href="/plans" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
