{% extends "base.html" %}
{% block title %}MFA Verification - Migration Assistant{% endblock %}
{% block auth_content %}
<div class="auth-login-shell" style="grid-template-columns: 1fr;">
    <section class="auth-login-panel">
        <div class="auth-login-card">
            <div class="text-center mb-4">
                <div class="auth-login-mark mx-auto mb-3">M</div>
                <h2 class="auth-login-form-title">Two-Factor Authentication</h2>
                <p class="auth-login-form-subtitle mb-0">Enter the code from your authenticator app.</p>
            </div>

            {% if errors %}
            <div class="auth-login-error" role="alert">
                {% for error in errors %}
                <div>{{ error }}</div>
                {% endfor %}
            </div>
            {% endif %}

            <form method="post" action="/auth/mfa-verify">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <div class="mb-3">
                    <label for="code" class="form-label">Authentication Code</label>
                    <input type="text" class="form-control auth-login-input text-center fs-4 letter-spacing-2" id="code" name="code" maxlength="6" pattern="[0-9]{6}" required autofocus autocomplete="one-time-code">
                </div>
                <button type="submit" class="btn auth-login-primary">Verify</button>
            </form>
        </div>
    </section>
</div>
{% endblock %}
